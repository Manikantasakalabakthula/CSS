<!DOCTYPE html>
<html lang"en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS COLORS, BACKGROUNDS AND BORDERS</title>
    <style>
     /* COLORS */
     .color-box{
          color: #ff5544;
          background-color: rgb(210, 225, 195);
          border: 2px solid hsl(0, 100%, 50%);
     }

     /* BACKGROUNDS */
     .background-box{
          background-color: aqua;
          background-image: url(/assets/images/BND.jpg);
          height: 700px;
          background-size: cover;
          background-position: center;
          background-repeat: no-repeat;
     }

     /* BORDER */
     .border-box{
          border: 3px solid black;
          border-radius: 10px;
          outline: 3px solid red;
     }
    </style>
</head>
<body>
     <!-- COLORS -->
    

    <h2>Q7. Colors</h2>

    <div class="color-box">
        CSS Colors
    </div>

    <!-- Requirements:
         - Use HEX for text color
         - Use RGB for background color
         - Add a border using HSL
    -->


    <!-- BACKGROUNDS -->
    

    <h2>Q8. Backgrounds</h2>

    <div class="background-box">
        Background Practice
    </div>

    <!-- Requirements:
         - Add a background color
         - Add a background image
         - Position the image
         - Control the image size
         - Prevent unnecessary repetition
    -->


    <!-- BORDERS -->
    

    <h2>Q9. Borders</h2>

    <div class="border-box">
        Border Practice
    </div>

    <!-- Requirements:
         - Add a 3px border
         - Use a solid border style
         - Add border radius
         - Add an outline
    -->
</body>
</html>
