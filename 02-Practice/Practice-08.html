<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS POSITIONING AND Z-INDEX</title>
    <style>
        /* POSITIONING */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            height: 250vh;
        }

        .position-container {
            border: 2px dashed #999;
            padding: 20px;
            margin-bottom: 30px;
            min-height: 120px;
            background-color: #f9f9f9;
        }

        .position-box {
            background-color: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            display: inline-block;
            font-weight: bold;
        }
        .static-box{
            position: static;
        }
        .relative-box{
            position: relative;
            top: 20px ;
            left: 40px;
        }
        .absolute-container{
            position: relative;
        }
        .absolute-box{
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .fixed-box{
            position: fixed;
            top: 20px;
            right: 20px;
        }
        .sticky-box{
            position: sticky;
            top: 10px;
        }

        /* Z-INDEX */
        .z-container{
            border: 2px dashed #999;
            padding: 20px;
            margin-bottom: 30px;
            min-height: 300px;
            background-color: #f9f9f9;
            position: relative;
        }
        .box{
            width: 200px;
            height: 100px;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            text-align: end;
        }
        .box-one{
            background-color: lightskyblue;
            position: absolute;
            top: 80px;
            left: 80px;
            z-index: 3;
        }
        .box-two{
            background-color: lightcoral;
            position: absolute;
            top: 100px;
            left: 180px;
            z-index: 2;
        }
        .box-three{
            background-color: lightpink;
            position: absolute;
            top: 120px;
            left: 280px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- POSITIONING -->

    <h2>Q15. Positioning</h2>

    <!-- 1. Static Position Example -->
    <div class="position-container">
        <div class="position-box static-box">
            Static (top/left ignored)
        </div>
    </div>

    <!-- 2. Relative Position Example -->
    <div class="position-container">
        <div class="position-box relative-box">
            Relative (top: 20px, left: 40px)
        </div>
    </div>

    <!-- 3. Absolute Position Example -->
    <div class="position-container absolute-container">
        <div class="position-box absolute-box">
            Absolute (top: 20px, right: 20px)
        </div>
    </div>

    <!-- 4. Fixed Position Example -->
    <div class="position-container">
        <div class="position-box fixed-box">
            Fixed (bottom: 20px, right: 20px)
        </div>
    </div>

    <!-- 5. Sticky Position Example -->
    <div class="position-container sticky-container">
        <div class="position-box sticky-box">
            Sticky (top: 10px) — Scroll to see effect
        </div>
    </div>

    <!-- Requirements:
         Create examples for:
         - static
         - relative
         - absolute
         - fixed
         - sticky

         Use top, right, bottom and left where appropriate.
    -->


    <!-- Z-INDEX -->

    <h2>Q16. Z-Index</h2>

    <div class="z-container">

        <div class="box box-one">Box 1</div>

        <div class="box box-two">Box 2</div>

        <div class="box box-three">Box 3</div>

    </div>

    <!-- Requirements:
         - Position both boxes
         - Make them overlap
         - Use z-index
         - Make Box 2 appear above Box 1
    -->

</body>
</html>
