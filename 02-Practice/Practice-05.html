<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS TEXT AND FONT</title>
    <style>
        /* TEXT */
        .text-practice{
            color: darkgoldenrod;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 50px;
        }

        /* FONTS */
        .font-practice{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 22px;
            font-weight: 600;
            font-style: italic;
        }
    </style>
</head>
<body>
    <!-- TEXT -->

    <h2>Q10. Text Styling</h2>

    <p class="text-practice">
        Learn CSS text properties by practicing different <br>
        text styles and spacing.
    </p>

    <!-- Requirements:
         - Change text color
         - Center the text
         - Add text decoration
         - Transform the text to uppercase
         - Change letter spacing
         - Change line height
    -->


    <!-- FONTS -->

    <h2>Q11. Fonts</h2>

    <p class="font-practice">
        Practice CSS font properties.
    </p>

    <!-- Requirements:
         - Change font family
         - Change font size
         - Make text bold
         - Make text italic
    -->
</body>
</html>
