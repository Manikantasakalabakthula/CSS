<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS UNITS AND BOX MODEL</title>
    <style>

        /* CSS UNITS */
        .unit-box{
            width: 50%;
            min-height: 20vh;
            margin-top: 20px;
            padding: 2vw;
            background-color: lightblue;
            font-size: 1.2rem;
        }

        /* BOX MODEL */
        .box-model{
            color: white;
            background-color: crimson;
            width: 200px;
            height: 100px;
            padding: 20px;
            border: 2px solid black;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <!--  CSS UNITS -->

    <h2>Q12. CSS Units</h2>

    <div class="unit-box">
        Responsive Unit Practice
    </div>

    <!-- BOX MODEL -->
