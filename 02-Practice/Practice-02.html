<!DOCTYPE html>
<html lang"en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS FUNDAMENTALS</title>
    <style>

        /* CSS FUNDAMENTALS */

        .intro{
            color: crimson;
            font-size: 20px;
            background-color: lightblue;
            padding: 10px;
        }


        /* SELECTORS */
        /* Element Selector */
        h3{
            color: purple;
            font-size: 25px;
            background-color: lightcyan;
            padding: 10px;
        }
        /* class Selector */
        .css-text{
            color: blueviolet;
            font-size: 24px;
            background-color: lightgoldenrodyellow;
            padding: 10px;
        }
        /* id Selector */
        #javascript-text{
            color: darkblue;
            font-size: 25px;
            background-color: lightcoral;
            padding: 10px;
        }
        /* Universal Selector */
        *{
            font-family: cursive;
        }


    </style>
</head>
<body>
    <h1>CSS FUNDAMENTALS</h1>

    
    
    <!-- CSS FUNDAMENTALS -->
    

    <h2>Q1. CSS Syntax & Styling</h2>

    <p class="intro">
        Style this paragraph using CSS.
    </p>

    <!-- Requirements:
         - Change text color
         - Change font size
         - Add background color
         - Add padding
    -->


    <!-- SELECTORS -->
    

    <h2>Q2. Basic Selectors</h2>

    <h3>HTML, CSS and JavaScript</h3>

    <p>HTML is used to structure webpages.</p>

    <p class="css-text">CSS is used to style webpages.</p>

    <p id="javascript-text">
        JavaScript is used to add behavior.
    </p>

    <!-- Requirements:
         - Use an element selector for h3
         - Use a class selector for .css-text
         - Use an id selector for #javascript-text
         - Use a universal selector to set a font
    -->

</body>
</html>
