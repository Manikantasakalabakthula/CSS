<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Styles</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
        }
    </style>

    <!-- External CSS would normally be linked like this -->
    <link rel="stylesheet" href="02-css-styles.css">
</head>

<body>

    <h1>Adding CSS to HTML</h1>

    <!-- Inline CSS -->
    <p style="color: red;">
        This text uses Inline CSS.
    </p>

    <h2>
        This text uses Internal CSS.
    </h2>

    <h3>
        This text can be styled using External CSS.
    </h3>

</body>
</html>
