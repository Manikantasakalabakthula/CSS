<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Z-Index</title>
    <style>
        *{
            font-family: Arial, sans-serif;
        }

        /* Common styling */
        .container {
            position: relative;
            width: 500px;
            height: 350px;
            border: 2px solid black;
        }

        .box {
            font-weight: 600;
            position: absolute;
            width: 180px;
            height: 120px;
            padding: 20px;
        }

        /* Lower stacking order */
        .box-one{
            background-color: lightblue;
            top: 50px;
            left: 50px;
            z-index: 1;

        }

        /* Higher stacking order */
        .box-two{
            background-color: lightcoral;
            top: 100px;
            left: 150px;
            z-index: 2;
        }
        
        /* Higher stacking order */
        .box-three{
            background-color: lightgreen;
            bottom: 30px;
            right: 30px;
            z-index: 3;
        }

        /* Negative z-index */
        .negative {
            position: absolute;
            top: 250px;
            left: 30px;
            background-color: lightyellow;
            z-index: -1;
        }

        /* Example with same z-index */
        .same-one{
            background-color: lightblue;
            position: absolute;
            padding: 20px 40px;
            right: 20px;
            top: 30px;
            z-index: 1;
        }

        .same-two{
            background-color: lightcoral;
            position: absolute;
            padding: 20px 40px;
            right: 40px;
            top: 70px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <h1>CSS Z-Index</h1>

    <h2>Basic Z-Index</h2>

    <div class="container">

        <div class="box box-one">
            Box One z-index: 1
        </div>

        <div class="box box-two">
            Box Two z-index: 2
        </div>

        <div class="box box-three">
            Box Three z-index: 3
        </div>

    </div>

    <h2>Negative Z-Index</h2>

    <div class="container">

        <div class="negative">
            Negative z-index
        </div>

        <p>
            This content is inside the container.
        </p>

    </div>

    <h2>Same Z-Index</h2>

    <div class="container">

        <div class="same-one">
            First
        </div>

        <div class="same-two">
            Second
        </div>

    </div>
</body>
</html>
