<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Comments</title>

    <style>
        
        /* This is a CSS comment */

        p {
            color: blue;
        }

        /*
            This is a
            multi-line CSS comment.
        */

        .example {
            font-size: 20px;
        }

    </style>
</head>

<body>

    <h1>CSS Comments</h1>

    <p>This paragraph is styled with CSS.</p>

    <p class="example">
        CSS comments are not displayed on the webpage.
    </p>

</body>
</html>
