<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background-color: #ffffff;
      width: 320px;
      padding: 24px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid #3b82f6;
    }
    .name {
      font-size: 1.25rem;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .role {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 16px;
    }
    .bio {
      font-size: 0.9rem;
      color: #334155;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="/assets/images/mani.jpg" alt="Manikanta">
    <h2 class="name">Manikanta</h2>
    <p class="role">Frontend Developer</p>
    <p class="bio">Passionate about building responsive, accessible interfaces and clean design systems.</p>
  </div>
</body>
</html>
