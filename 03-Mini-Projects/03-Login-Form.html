<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .login-container {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 32px;
      border-radius: 12px;
    }
    .login-header {
      margin-bottom: 24px;
      text-align: center;
    }
    .login-header h2 {
      font-size: 1.5rem;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .login-header p {
      color: #64748b;
      font-size: 0.875rem;
    }
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #334155;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .submit-btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Enter your details to access your account</p>
    </div>
    <form>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="submit-btn">Sign In</button>
    </form>
  </div>
</body>
</html>
